# ---------------------------------------------------------------------------
# Dataset configuration for YOLO11 training / evaluation.
#
# The dataset is NOT stored in this repository. Download it separately and
# extract it so that the `path` below points at the extracted `dataset/`
# folder. See README.md for download and extraction instructions.
#
# Expected layout:
#   dataset/
#     images/
#       train/
#       val/
#       test/
#     labels/
#       train/
#       val/
#       test/
#
# `path` is relative to the project root (the folder that contains this file).
# The provided Python entry points resolve it for you, so you can launch them
# from any working directory.
# ---------------------------------------------------------------------------

path: dataset
train: images/train
val: images/val
test: images/test

# ---------------------------------------------------------------------------
# Classes
#
# 35 numeric class IDs carried over from the original project. The original
# dataset shipped WITHOUT semantic class names, so these remain placeholders
# (class_00 ... class_34). Do not treat them as confirmed object categories.
#
# If you later identify what each ID means, rename the values here and keep
# the numeric IDs unchanged. This only changes the labels drawn on boxes; it
# does not change trained weights.
# ---------------------------------------------------------------------------

nc: 35
names:
  0: class_00
  1: class_01
  2: class_02
  3: class_03
  4: class_04
  5: class_05
  6: class_06
  7: class_07
